<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Manager - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <div class="blob amber"></div>
    <div class="blob teal"></div>
    <div class="blob coral"></div>
  </div>
  <header class="topbar">
    <h1><span class="dot"></span>Fleet Manager</h1>
    <nav>
      <a class="tab active" href="/index.html">Dashboard</a>
      <a class="tab" href="/vehicles.html">Vehicles</a>
      <a class="tab" href="/drivers.html">Drivers</a>
      <a class="tab" href="/trips.html">Trips</a>
      <a class="tab" href="/maintenance.html">Maintenance</a>
      <a class="tab" href="/kpis.html">KPIs</a>
    </nav>
  </header>

  <main>
    <h2>Overview <span id="live-indicator" class="live-indicator">● live</span></h2>
    <p class="last-updated" id="last-updated"></p>
    <div class="cards" id="stat-cards"></div>
    <h3>Upcoming / In-Progress Maintenance</h3>
    <table id="upcoming-maintenance-table">
      <thead><tr><th>Vehicle</th><th>Service</th><th>Next Due</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>

  <script src="/js/shared.js"></script>
  <script src="/js/dashboard.js"></script>
