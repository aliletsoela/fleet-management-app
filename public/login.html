<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Manager - Log In</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <div class="blob amber"></div>
    <div class="blob teal"></div>
    <div class="blob coral"></div>
  </div>

  <main class="login-main">
    <form id="login-form" class="login-card">
      <h1><span class="dot"></span>Fleet Manager</h1>
      <p class="login-subtitle">Sign in to continue</p>
      <input name="email" type="email" placeholder="Email" required autocomplete="username">
      <input name="password" type="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit">Log In</button>
      <p class="login-error" id="login-error"></p>
    </form>
  </main>

  <script src="/js/shared.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
