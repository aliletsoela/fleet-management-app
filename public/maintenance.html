<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Manager - Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <div class="blob amber"></div>
    <div class="blob teal"></div>
    <div class="blob coral"></div>
  </div>
  <header class="topbar">
    <h1><span class="dot"></span>Fleet Manager</h1>
    <nav>
      <a class="tab" href="/index.html">Dashboard</a>
      <a class="tab" href="/vehicles.html">Vehicles</a>
      <a class="tab" href="/drivers.html">Drivers</a>
      <a class="tab" href="/trips.html">Trips</a>
      <a class="tab active" href="/maintenance.html">Maintenance</a>
      <a class="tab" href="/kpis.html">KPIs</a>
    </nav>
  </header>

  <main>
    <h2>Maintenance</h2>
    <form id="maintenance-form" class="inline-form">
      <select name="vehicle_id" required></select>
      <input name="service_type" placeholder="Service type" required>
      <input name="description" placeholder="Description">
      <input name="cost" placeholder="Cost" type="number" step="0.01">
      <input name="service_date" type="date" required>
      <input name="next_due_date" type="date">
      <select name="status">
        <option value="completed">Completed</option>
        <option value="scheduled">Scheduled</option>
        <option value="in_progress">In progress</option>
      </select>
      <button type="submit">Log Service</button>
    </form>
    <table id="maintenance-table">
      <thead><tr><th>Vehicle</th><th>Service</th><th>Cost</th><th>Date</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </main>

  <script src="/js/shared.js"></script>
  <script src="/js/maintenance.js"></script>
</body>
</html>
