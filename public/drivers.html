<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Manager - Drivers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <div class="blob amber"></div>
    <div class="blob teal"></div>
    <div class="blob coral"></div>
  </div>
  <header class="topbar">
    <h1><span class="dot"></span>Fleet Manager</h1>
    <nav>
      <a class="tab" href="/index.html">Dashboard</a>
      <a class="tab" href="/vehicles.html">Vehicles</a>
      <a class="tab active" href="/drivers.html">Drivers</a>
      <a class="tab" href="/trips.html">Trips</a>
      <a class="tab" href="/maintenance.html">Maintenance</a>
      <a class="tab" href="/kpis.html">KPIs</a>
       <button class="tab logout-btn" onclick="logout()">Logout</button>
    </nav>
  </header>

  <main>
    <h2>Drivers</h2>
    <form id="driver-form" class="inline-form">
      <input name="full_name" placeholder="Full name" required>
      <input name="license_number" placeholder="License number" required>
      <input name="phone" placeholder="Phone">
      <input name="email" placeholder="Email" type="email">
      <button type="submit">Add Driver</button>
    </form>
    <table id="drivers-table">
      <thead><tr><th>Name</th><th>License</th><th>Phone</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </main>

  <script src="/js/shared.js"></script>
  <script src="/js/drivers.js"></script>
</body>
</html>
